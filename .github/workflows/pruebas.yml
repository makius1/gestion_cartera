# Prueba de integración contra un PostgreSQL real.
#
# En cada envío al repositorio, GitHub levanta un servidor PostgreSQL temporal,
# simula una cartera, la registra, ejecuta el motor de elegibilidad, segmenta y
# prioriza, y abre cada pantalla de la aplicación web con cada rol. Así se comprueba en
# cada cambio que el sistema funciona sobre el mismo motor que usa Supabase,
# sin tocar la base de producción ni depender de ningún equipo local.

name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  base-de-datos:
    # El nombre del trabajo es el de la verificacion que exige la regla de main
    name: Pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cobranza
        ports:
          - 5432:5432
        # Espera a que el servidor acepte conexiones antes de empezar.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cobranza
      # Clave fija solo para esta prueba: los datos son ficticios y la base se
      # destruye al terminar.
      SEUDONIMO_CLAVE: clave-exclusiva-de-integracion-continua
      PYTHONIOENCODING: utf-8

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: "Probar la confirmacion de escritura remota (issue #36)"
        run: python -m pruebas.prueba_confirmacion

      - name: "Probar la clave de seudonimos contra una base remota (issue #37)"
        run: python -m pruebas.prueba_seudonimos

      - name: Verificar la conexión
        run: python -m datos.base_datos probar

      - name: Generar y cargar una cartera ficticia
        # El PostgreSQL de esta prueba es temporal, pero para el sistema no es
        # SQLite: sin la confirmación, el comando se negaría a escribir.
        run: python -m datos.base_datos sintetica --registros 2000 --confirmar-remota

      - name: Comprobar que la carga quedó completa
        run: |
          python - <<'PY'
          from datos.base_datos import leer_cartera, listar_cargas
          cargas = listar_cargas()
          cartera = leer_cartera()
          assert len(cargas) == 1, "se esperaba una carga, hay %d" % len(cargas)
          assert len(cartera) == 2000, "se esperaban 2000 cuentas, hay %d" % len(cartera)
          assert cartera["credito_id"].is_unique, "hay créditos duplicados"
          assert cartera["cuenta_id"].str.len().eq(13).all(), "seudónimos mal formados"
          print("Carga verificada: %d cuentas, saldo total $%s" % (
              len(cartera), "{:,.0f}".format(float(cartera["saldo"].sum()))))
          PY

      - name: "Probar la autorizacion por canal (issue #25)"
        run: python -m pruebas.prueba_autorizaciones

      - name: "Probar el reloj del servidor contra la base (issue #51)"
        run: python -m pruebas.prueba_reloj

      - name: Validar la base de conocimiento
        run: python -m motor.elegibilidad --validar

      - name: "Probar el historial de gestiones simulado (issue #11)"
        run: python -m pruebas.prueba_generador

      - name: "Probar cada regla del motor (issue #7)"
        run: python -m pruebas.prueba_reglas_motor

      # Se evalúa un martes hábil fijo para que el resultado no dependa del día
      # en que corre la prueba: un domingo o un festivo bloquearían todo.
      - name: Ejecutar el motor de elegibilidad
        run: |
          python -m motor.elegibilidad --fecha 2026-09-15
          python - <<'PY'
          from datos.base_datos import leer_evaluaciones, listar_ejecuciones
          ejecucion = listar_ejecuciones(1).iloc[0]
          detalle = leer_evaluaciones(int(ejecucion["id"]))
          assert len(detalle) == 2000, "se esperaban 2000 evaluaciones, hay %d" % len(detalle)
          assert detalle["regla_determinante"].notna().all(), "hay cuentas sin regla determinante"
          contactables = detalle[detalle["estado"] == "CONTACTABLE"]
          assert contactables["canal_recomendado"].notna().all(), "hay contactables sin canal"
          print("Motor verificado: %d contactables de %d" % (len(contactables), len(detalle)))
          PY

      - name: Segmentar y priorizar la cartera
        run: |
          python -c "from decision.conocimiento_difuso import validar; e = validar(); assert not e, e"
          python -m decision.priorizacion --ejecucion 1
          python - <<'PY'
          from datos.base_datos import leer_prioridades, listar_priorizaciones
          cabecera = listar_priorizaciones(1).iloc[0]
          detalle = leer_prioridades(int(cabecera["id"]))
          candidatas = detalle[detalle["candidata"]]
          assert len(detalle) == 2000, "se esperaban 2000 cuentas, hay %d" % len(detalle)
          assert cabecera["metodo_elegido"] in ("difuso", "topsis", "ponderado")
          assert candidatas["posicion"].notna().all(), "hay candidatas sin posición"
          assert candidatas["posicion"].is_unique, "hay posiciones repetidas"
          assert detalle["en_capacidad"].sum() == min(int(cabecera["capacidad"]), len(candidatas))
          print("Priorización verificada: %d candidatas, %d segmentos, método %s" % (
              len(candidatas), cabecera["k_segmentos"], cabecera["metodo_elegido"]))
          PY

      # Se registra una gestión saliente con un momento fijo (martes a las 10) y
      # se comprueba que la cartera se actualiza, que el motor bloquea un nuevo
      # contacto por frecuencia y que las reglas rechazan una gestión inválida.
      - name: Registrar gestiones y verificar la retroalimentación
        run: |
          python - <<'PY'
          from datetime import date, datetime
          from datos import base_datos as bd
          from gestion import operacion as op
          momento = datetime(2026, 9, 15, 10, 0)
          cartera = bd.leer_cartera()
          carga = int(cartera["carga_id"].iloc[0])
          filas = cartera.to_dict(orient="records")
          fila = next(f for f in filas if op.estado_hoy(f, momento)["estado"] == "CONTACTABLE")
          datos = {"canal": op.estado_hoy(fila, momento)["canal_recomendado"], "sentido": "SALIENTE",
                   "resultado": "ACUERDO", "codigo": "PAGO TOTAL", "motivo_no_pago": "No aplica",
                   "valor_acordado": float(fila["cobranza_min"]), "fecha_compromiso": date(2026, 9, 20),
                   "fecha_proxima_gestion": date(2026, 9, 25),
                   "observacion": "Verificacion automatica: acuerdo de pago total."}
          op.registrar(carga, fila["credito_id"], datos, "integracion", momento)
          nueva = bd.leer_cartera(carga).set_index("credito_id").loc[fila["credito_id"]]
          assert nueva["codigo"] == "PAGO TOTAL" and bool(nueva["tiene_compromiso"])
          despues = op.estado_hoy(nueva.to_dict() | {"credito_id": fila["credito_id"]},
                                  datetime(2026, 9, 15, 11, 0))
          assert despues["regla_determinante"] == "L2", despues["regla_determinante"]
          try:
              op.registrar(carga, fila["credito_id"], dict(datos, resultado="BUZON"), "integracion", momento)
              raise AssertionError("se aceptó un acuerdo sin contacto")
          except ValueError as error:
              reglas = [r for r, _ in error.args[0]]
          assert "G5" in reglas or "G6" in reglas, reglas
          print("Gestión verificada: cartera actualizada, recontacto bloqueado y reglas %s" % reglas)
          PY

      - name: Probar la aplicación web por rol
        run: python -m pruebas.prueba_aplicacion

      - name: "Probar la reserva de cuentas (issue #16)"
        run: python -m pruebas.prueba_reservas

      - name: "Probar el registro de obligaciones nuevas (issue #17)"
        run: python -m pruebas.prueba_obligaciones

      - name: Estado final de la base
        run: python -m datos.base_datos probar